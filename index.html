<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複素関数 領域着色 Canvas</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center mb-2 text-cyan-300">🌀 複素関数 領域着色 (Domain Coloring)</h1>
  <p class="text-center text-gray-400 mb-4 text-sm">偏角 → 色相 / 絶対値 → 明度</p>

  <div class="flex gap-4">
    <!-- Canvas -->
    <div class="flex-1">
      <canvas id="mainCanvas" width="520" height="520"
        class="rounded-xl border border-cyan-800 cursor-crosshair w-full"
        style="max-width:520px"></canvas>
      <div id="coordInfo" class="text-xs text-gray-400 mt-1 text-center">ドラッグ:パン / ホイール:ズーム</div>
    </div>

    <!-- Controls -->
    <div class="w-56 space-y-3">
      <div class="bg-gray-800 rounded-xl p-3">
        <label class="block text-xs text-cyan-300 mb-2 font-bold">プリセット関数</label>
        <div class="space-y-1">
          <button data-fn="z" aria-label="f(z)=z" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-cyan-900 hover:bg-cyan-700 transition">f(z) = z</button>
          <button data-fn="z2" aria-label="f(z)=z^2" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = z²</button>
          <button data-fn="z3" aria-label="f(z)=z^3" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = z³</button>
          <button data-fn="z4" aria-label="f(z)=z^4" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = z⁴</button>
          <button data-fn="sinz" aria-label="f(z)=sin(z)" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = sin(z)</button>
          <button data-fn="cosz" aria-label="f(z)=cos(z)" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = cos(z)</button>
          <button data-fn="expz" aria-label="f(z)=exp(z)" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = exp(z)</button>
          <button data-fn="invz" aria-label="f(z)=1/z" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = 1/z</button>
          <button data-fn="mobius" aria-label="f(z)=(z^2-1)/(z^2+1)" class="fn-btn w-full text-left text-xs px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 transition">f(z) = (z²-1)/(z²+1)</button>
        </div>
      </div>

      <div class="bg-gray-800 rounded-xl p-3">
        <label class="block text-xs text-cyan-300 mb-1 font-bold">カスタム f(z)</label>
        <input type="text" id="customFn" aria-label="カスタム関数入力"
          class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-xs focus:outline-none focus:border-cyan-400"
          placeholder="z*z + 1/z">
        <button id="applyCustom" aria-label="カスタム関数を適用" class="w-full mt-1 bg-cyan-700 hover:bg-cyan-600 text-white text-xs py-1 rounded transition">
          適用
        </button>
        <div class="text-xs text-gray-500 mt-1">使用可: z,+,-,*,/,^,sin,cos,exp</div>
      </div>

      <div class="bg-gray-800 rounded-xl p-3">
        <label class="block text-xs text-cyan-300 mb-2 font-bold">ビュー</label>
        <button id="resetView" aria-label="ビューをリセット" class="w-full bg-gray-700 hover:bg-gray-600 text-xs py-1 rounded transition mb-2">
          リセット
        </button>
        <div class="text-xs text-gray-400">
          <div>中心: <span id="viewCenter">0+0i</span></div>
          <div>スケール: <span id="viewScale">2</span></div>
        </div>
      </div>

      <div class="bg-gray-800 rounded-xl p-3">
        <label class="block text-xs text-cyan-300 mb-1 font-bold">説明</label>
        <div class="text-xs text-gray-400 space-y-1">
          <div>色相 = arg(f(z))</div>
          <div>明度 = mod(f(z))</div>
          <div>黒点 = 零点</div>
          <div>白点 = 極</div>
        </div>
      </div>

      <div id="renderStatus" class="text-xs text-center text-gray-500"></div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let viewCx = 0, viewCy = 0, viewScale = 2; // scale = units per half-canvas
let currentFn = 'z';
let isDragging = false, dragStart = null;

// Complex number arithmetic
function cadd(a, b) { return { r: a.r + b.r, i: a.i + b.i }; }
function csub(a, b) { return { r: a.r - b.r, i: a.i - b.i }; }
function cmul(a, b) { return { r: a.r * b.r - a.i * b.i, i: a.r * b.i + a.i * b.r }; }
function cdiv(a, b) {
  const d = b.r * b.r + b.i * b.i;
  if (d < 1e-300) return { r: 1e15, i: 1e15 };
  return { r: (a.r * b.r + a.i * b.i) / d, i: (a.i * b.r - a.r * b.i) / d };
}
function cpow(a, n) {
  if (n === 0) return { r: 1, i: 0 };
  let result = { r: 1, i: 0 };
  for (let k = 0; k < Math.abs(n); k++) result = cmul(result, a);
  if (n < 0) return cdiv({ r: 1, i: 0 }, result);
  return result;
}
function csin(z) {
  // sin(x+iy) = sin(x)cosh(y) + i cos(x)sinh(y)
  return { r: Math.sin(z.r) * Math.cosh(z.i), i: Math.cos(z.r) * Math.sinh(z.i) };
}
function ccos(z) {
  return { r: Math.cos(z.r) * Math.cosh(z.i), i: -Math.sin(z.r) * Math.sinh(z.i) };
}
function cexp(z) {
  const e = Math.exp(z.r);
  return { r: e * Math.cos(z.i), i: e * Math.sin(z.i) };
}
function cmod(z) { return Math.sqrt(z.r * z.r + z.i * z.i); }
function carg(z) { return Math.atan2(z.i, z.r); }

function evalFn(z, fnName) {
  switch (fnName) {
    case 'z': return z;
    case 'z2': return cmul(z, z);
    case 'z3': return cmul(cmul(z, z), z);
    case 'z4': return cmul(cmul(cmul(z, z), z), z);
    case 'sinz': return csin(z);
    case 'cosz': return ccos(z);
    case 'expz': return cexp(z);
    case 'invz': return cdiv({ r: 1, i: 0 }, z);
    case 'mobius': {
      const z2 = cmul(z, z);
      return cdiv(csub(z2, { r: 1, i: 0 }), cadd(z2, { r: 1, i: 0 }));
    }
    default: return evalCustom(z, fnName);
  }
}

// Safe custom evaluator (token-based)
function evalCustom(z, expr) {
  try {
    const re = { r: z.r, i: 0 };
    const im = { r: 0, i: z.i };
    // Tokenize and evaluate safely
    const fns = { sin: csin, cos: ccos, exp: cexp };
    // Very simple recursive descent parser
    const tokens = tokenize(expr);
    return parseExpr(tokens, z);
  } catch (e) {
    return z;
  }
}

function tokenize(s) {
  const result = [];
  let i = 0;
  while (i < s.length) {
    if (/\s/.test(s[i])) { i++; continue; }
    if (/[0-9.]/.test(s[i])) {
      let num = '';
      while (i < s.length && /[0-9.]/.test(s[i])) num += s[i++];
      result.push({ type: 'num', val: parseFloat(num) });
    } else if (/[a-zA-Z]/.test(s[i])) {
      let name = '';
      while (i < s.length && /[a-zA-Z]/.test(s[i])) name += s[i++];
      result.push({ type: 'id', val: name });
    } else {
      result.push({ type: 'op', val: s[i] });
      i++;
    }
  }
  result.push({ type: 'eof' });
  return result;
}

class Parser {
  constructor(tokens, z) { this.tokens = tokens; this.pos = 0; this.z = z; }
  peek() { return this.tokens[this.pos]; }
  consume() { return this.tokens[this.pos++]; }
  parseExpr() { return this.parseAdd(); }
  parseAdd() {
    let left = this.parseMul();
    while (this.peek().val === '+' || this.peek().val === '-') {
      const op = this.consume().val;
      const right = this.parseMul();
      left = op === '+' ? cadd(left, right) : csub(left, right);
    }
    return left;
  }
  parseMul() {
    let left = this.parsePow();
    while (this.peek().val === '*' || this.peek().val === '/') {
      const op = this.consume().val;
      const right = this.parsePow();
      left = op === '*' ? cmul(left, right) : cdiv(left, right);
    }
    return left;
  }
  parsePow() {
    let base = this.parseUnary();
    if (this.peek().val === '^') {
      this.consume();
      const exp = this.parseUnary();
      const n = Math.round(exp.r);
      return cpow(base, n);
    }
    return base;
  }
  parseUnary() {
    if (this.peek().val === '-') {
      this.consume();
      const val = this.parsePrimary();
      return { r: -val.r, i: -val.i };
    }
    return this.parsePrimary();
  }
  parsePrimary() {
    const t = this.peek();
    if (t.type === 'num') { this.consume(); return { r: t.val, i: 0 }; }
    if (t.type === 'id') {
      this.consume();
      if (t.val === 'z') return this.z;
      if (t.val === 'i') return { r: 0, i: 1 };
      if (t.val === 'pi') return { r: Math.PI, i: 0 };
      if (t.val === 'e') return { r: Math.E, i: 0 };
      // function call
      const fnMap = { sin: csin, cos: ccos, exp: cexp };
      if (fnMap[t.val] && this.peek().val === '(') {
        this.consume(); // (
        const arg = this.parseExpr();
        if (this.peek().val === ')') this.consume();
        return fnMap[t.val](arg);
      }
      return { r: 0, i: 0 };
    }
    if (t.val === '(') {
      this.consume();
      const val = this.parseExpr();
      if (this.peek().val === ')') this.consume();
      return val;
    }
    this.consume();
    return { r: 0, i: 0 };
  }
}

function parseExpr(tokens, z) {
  const p = new Parser(tokens, z);
  return p.parseExpr();
}

// HSL to RGB
function hslToRgb(h, s, l) {
  h = ((h % 1) + 1) % 1;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 1/6) { r = c; g = x; b = 0; }
  else if (h < 2/6) { r = x; g = c; b = 0; }
  else if (h < 3/6) { r = 0; g = c; b = x; }
  else if (h < 4/6) { r = 0; g = x; b = c; }
  else if (h < 5/6) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function render() {
  document.getElementById('renderStatus').textContent = '計算中...';
  const imageData = ctx.createImageData(W, H);
  const data = imageData.data;
  const fn = currentFn;

  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const cx = viewCx + (px / W - 0.5) * 2 * viewScale;
      const cy = viewCy - (py / H - 0.5) * 2 * viewScale;
      const z = { r: cx, i: cy };
      let w;
      try { w = evalFn(z, fn); } catch (e) { w = { r: 0, i: 0 }; }

      const arg = carg(w); // -π to π
      const mod = cmod(w);

      // Hue from argument
      const hue = (arg / (2 * Math.PI) + 0.5);
      // Lightness from log magnitude (ranges 0→1 with modulation)
      const logMod = mod < 1e-10 ? -10 : Math.log(mod);
      const lightness = 0.5 + 0.3 * (logMod - Math.floor(logMod) - 0.5);
      const saturation = 0.85;

      const [r, g, b] = hslToRgb(hue, saturation, Math.max(0, Math.min(1, lightness)));
      const idx = (py * W + px) * 4;
      data[idx] = r;
      data[idx + 1] = g;
      data[idx + 2] = b;
      data[idx + 3] = 255;
    }
  }
  ctx.putImageData(imageData, 0, 0);

  // Draw axes
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  // X axis
  const axisY = H * (0.5 + viewCy / (2 * viewScale));
  ctx.beginPath(); ctx.moveTo(0, axisY); ctx.lineTo(W, axisY); ctx.stroke();
  // Y axis
  const axisX = W * (0.5 - viewCx / (2 * viewScale));
  ctx.beginPath(); ctx.moveTo(axisX, 0); ctx.lineTo(axisX, H); ctx.stroke();

  document.getElementById('renderStatus').textContent = '描画完了';
  document.getElementById('viewCenter').textContent = `${viewCx.toFixed(2)}+${viewCy.toFixed(2)}i`;
  document.getElementById('viewScale').textContent = viewScale.toFixed(2);
}

// Initial render
render();

// Preset buttons
document.querySelectorAll('.fn-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fn-btn').forEach(b => b.className = b.className.replace('bg-cyan-900', 'bg-gray-700'));
    btn.className = btn.className.replace('bg-gray-700', 'bg-cyan-900');
    currentFn = btn.dataset.fn;
    render();
  });
});

document.getElementById('applyCustom').addEventListener('click', () => {
  const expr = document.getElementById('customFn').value.trim();
  if (!expr) return;
  currentFn = expr;
  render();
});

document.getElementById('resetView').addEventListener('click', () => {
  viewCx = 0; viewCy = 0; viewScale = 2;
  render();
});

// Mouse events for pan
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY, cx: viewCx, cy: viewCy };
});
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = viewCx + (px * scaleX / W - 0.5) * 2 * viewScale;
  const cy = viewCy - (py * scaleY / H - 0.5) * 2 * viewScale;
  document.getElementById('coordInfo').textContent = `z = ${cx.toFixed(3)} + ${cy.toFixed(3)}i`;

  if (isDragging && dragStart) {
    const dx = (e.clientX - dragStart.x) / rect.width * 2 * viewScale;
    const dy = (e.clientY - dragStart.y) / rect.height * 2 * viewScale;
    viewCx = dragStart.cx - dx;
    viewCy = dragStart.cy + dy;
  }
});
canvas.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; render(); }
});
canvas.addEventListener('mouseleave', () => {
  if (isDragging) { isDragging = false; render(); }
});

// Wheel zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.2 : 0.8;
  viewScale *= factor;
  render();
}, { passive: false });

// LocalStorage: persist current function and view state
function saveState() {
  localStorage.setItem('domain_fn', currentFn);
  localStorage.setItem('domain_view', JSON.stringify({ cx: viewCx, cy: viewCy, scale: viewScale }));
}
function loadState() {
  const fn = localStorage.getItem('domain_fn');
  if (fn) {
    currentFn = fn;
    const btn = document.querySelector(`[data-fn="${fn}"]`);
    if (btn) {
      document.querySelectorAll('.fn-btn').forEach(b => b.className = b.className.replace('bg-cyan-900', 'bg-gray-700'));
      btn.className = btn.className.replace('bg-gray-700', 'bg-cyan-900');
    } else {
      document.getElementById('customFn').value = fn;
    }
  }
  const view = localStorage.getItem('domain_view');
  if (view) try { const v = JSON.parse(view); viewCx = v.cx; viewCy = v.cy; viewScale = v.scale; } catch(e) {}
}
loadState();
render();
setInterval(saveState, 4000);
</script>
</body>
</html>
